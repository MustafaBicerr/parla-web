name: Deploy RTDB rules

# Yalnızca kurallar değiştiğinde ve FIREBASE_SERVICE_ACCOUNT secret'ı tanımlıysa dağıtır.
# Secret yoksa iş "atlandı" olarak biter (hata vermez); kurallar elle dağıtılır: firebase deploy --only database
# (bkz. docs/runbook.md §3). Sertleştirme (ALT-15):
#  - secret YALNIZCA "Dağıt" adımının ortamındadır; npm ci / npm test adımları (bağımlılık zinciri) onu görmez;
#  - workflow_dispatch yalnızca main dalından çalışır (başka daldaki değiştirilmiş kurallar dağıtılamaz);
#  - aynı anda tek dağıtım (concurrency); firebase-tools sürümü sabit; izinler salt okunur.
on:
  push:
    branches: [main]
    paths:
      - database.rules.json
      - tests/rules/generate-rules.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Kural kaynağı ile database.rules.json aynı mı?
        run: |
          node tests/rules/generate-rules.js "$RUNNER_TEMP/generated.rules.json"
          diff -u database.rules.json "$RUNNER_TEMP/generated.rules.json"
      - name: Kurallar testten geçiyor mu?
        working-directory: tests/rules
        run: |
          npm ci --no-fund
          npm test
      - name: Dağıt
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT tanımlı değil; kurallar otomatik dağıtılmadı (docs/runbook.md §3)."
            exit 0
          fi
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13.35.1 deploy --only database --project parla-bt-web --non-interactive
