# --- Önbellek başlıkları (mevcut; korunur) ---------------------------------------------------------------------
[[headers]]
  for = "/assets/js/support-v2/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/css/support-v2.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/js/firebase-init.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/js/site-config.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/support-v2/docs/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

# --- Uzun önbellek (WP-13/15: logo/yazı tipi/FA alt kümesi tekrar tekrar indirilmesin) ---------------------------
# Dosya adlarında içerik özeti (hash) YOK; bu yüzden "immutable" kullanılmaz: dosya yerinde değişirse (ör. logo ya da
# fa-subset.css yeniden üretilirse) kullanıcılar en geç aşağıdaki süre sonunda yenisini alır. Dosya adına özet eklenirse
# (ör. logo.3fa9c1.png) o desen için `public, max-age=31536000, immutable` kuralı ayrıca eklenebilir.
# Bu desenler yukarıdaki "no-cache" yollarıyla ÇAKIŞMAZ (aynı başlığı iki kural birden ayarlamasın).
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
