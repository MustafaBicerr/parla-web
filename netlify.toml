# --- Güvenlik başlıkları (ALT-07) -----------------------------------------------------------------------------
# Tüm site. (HSTS Netlify tarafından otomatik eklenir.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "SAMEORIGIN"

# Portal: arama motorları indekslemesin (PDF kılavuzlar dahil — /support-v2/docs/* altında).
[[headers]]
  for = "/support-v2/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# CSP: ÖNCE Report-Only (1-2 hafta; ihlaller /api/csp-report ile function günlüğüne düşer). Temiz görününce başlık adı
# "Content-Security-Policy" yapılır. Ana site (GTM satır içi script, onclick=, @import) bu CSP ile bozulacağından yalnızca
# portal HTML'lerine uygulanır; PDF'ler dışarıda kalsın diye dizinler tek tek yazıldı (/support-v2/docs/* yok).
# 25 portal sayfasında 0 ihlalle denendi (harness: Firebase SDK taklit edildi) — gerçek Firebase Auth iframe'i / Analytics
# uçları canlıda Report-Only ile doğrulanmalı. EMAIL_API_URL başka origin'e çevrilirse connect-src'ye eklenmeli.

[[headers]]
  for = "/support-v2/login.html"
  [headers.values]
    Reporting-Endpoints = 'csp="/api/csp-report"'
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://apis.google.com; style-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src-attr 'unsafe-inline'; font-src 'self' https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https://cdn.jsdelivr.net https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://*.firebasedatabase.app wss://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebaseinstallations.googleapis.com https://firebase.googleapis.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://cdn.jsdelivr.net; frame-src https://parla-bt-web.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-report; report-to csp"

# Gizlilik/KVKK sayfası (statik, betik yok): dar CSP (Report-Only, diğer portal sayfalarıyla aynı geçiş planı).
[[headers]]
  for = "/support-v2/privacy.html"
  [headers.values]
    Reporting-Endpoints = 'csp="/api/csp-report"'
    Content-Security-Policy-Report-Only = "default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; report-uri /api/csp-report; report-to csp"

