# ============================================================================
# Parla BT — netlify.toml
#
# publish = "." olduğundan depo kökündeki git'te izlenen HER dosya sitede görünür olurdu. Aşağıdaki
# "force = true" 404 yönlendirmeleri yayın dışı yolları 404.html ile kapatır (denetim ALT-02 EK-1; emülasyonda
# 27/27 yayın dışı yol 404, site/portal yolları açık). Bu KAPALI bir listedir: kök dizine yeni dosya/klasör
# eklenince buraya da eklenmeli (örn. yeni bir .gs/.json dosyası). Kalıcı çözüm: siteyi public/ altına taşıyıp
# publish = "public" yapmak (planlı iş; ayrıca firebase.json hosting bloğu kaldırılacak).
# NOT: Netlify "splat" (*) yalnızca yolun sonunda kullanılabilir; bu yüzden /*.gs gibi desenler yerine tek tek yazılmıştır.
# ============================================================================

[build]
  publish = "."
  functions = "netlify/functions"
  # Kredi tasarrufu (isteğe bağlı, açmak için başındaki # kaldırın): yalnızca belge/test/CI değişince derleme yapma.
  # ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)tests' ':(exclude).github' ':(exclude)*.md'"

[build.environment]
  # Node 20 bakım sonuna girdi (ALT-21). CI de Node 22 kullanır.
  NODE_VERSION = "22"

# Branch deploy / deploy preview build kredisi harcar (CLAUDE.md). Kapatmak için:
# [context.branch-deploy]
#   ignore = "exit 0"
# [context.deploy-preview]
#   ignore = "exit 0"
# Önizleme adresinden e-posta fonksiyonunu denemek için o host'u ALLOWED_ORIGINS'e ekleyin (*.netlify.app joker YOKTUR).

[functions]
  node_bundler = "esbuild"
  # Netlify Blobs (@netlify/blobs) netlify/functions/package.json üzerinden kurulur.

# send-email fonksiyonu (ALT-21): dış çağrılara kod içinde zaman aşımı konur (Resend 5 sn, RTDB/sertifika 3 sn,
# toplam bütçe ≈8,5 sn → Netlify varsayılan 10 sn içinde kalır). Planınız izin veriyorsa fonksiyon zaman aşımı
# artırılabilir (Site configuration → Functions; netlify.toml'da zaman aşımı anahtarı garanti değildir).
# Bölge: RTDB europe-west1 (Belçika) olduğundan fonksiyon bölgesini Avrupa'ya (ör. eu-central-1) alın:
# Netlify UI → Site configuration → Functions → Region (planınız destekliyorsa). Kod/toml ile ayarlanamaz.
# E-posta ortam değişkenleri: bkz. .env.example (RESEND_API_KEY, SITE_URL, CONTACT_EMAIL, ALLOWED_ORIGINS, ...).
# Günlük özet: netlify/functions/email-digest.mjs zamanlanmış işlev (06:00 UTC); yalnızca yayındaki (production) dağıtımda çalışır.
# Sunucu tarafı kullanıcı yönetimi: netlify/functions/admin-users.js (/api/admin-users; FIREBASE_SERVICE_ACCOUNT gerekir, yoksa 503 not_configured).
# Zamanlanmış otomasyon: ticket-automation.mjs (her 30 dk: SLA uyarısı, hatırlatmalar, otomatik kapanış, eskalasyon) ve
# backup-export.mjs (günlük RTDB yedeği → Netlify Blobs). İkisi de FIREBASE_SERVICE_ACCOUNT yoksa kendiliğinden atlanır.

