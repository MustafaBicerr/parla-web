<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sayfa bulunamadı | Parla BT</title>
  <style>
    :root { color-scheme: light dark; --bg: #f3f1ed; --card: #ffffff; --ink: #1a1a1a; --muted: #5b6370; --accent: #d45f16; --line: #e8e4de; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1722; --card: #17212f; --ink: #f2f4f7; --muted: #aab3c0; --accent: #ff9a5c; --line: #2a3647; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; }
    main { width: 100%; max-width: 32rem; padding: 32px 28px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; border-top: 6px solid var(--accent); }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 16px; color: var(--muted); }
    nav { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a { display: inline-block; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accent); color: var(--accent); font-weight: 600; text-decoration: none; }
    a:hover, a:focus-visible { background: var(--accent); color: var(--card); outline: none; }
  </style>
</head>
<body>
  <main>
    <h1>404 — Sayfa bulunamadı</h1>
    <p>Aradığınız sayfa yok veya taşınmış olabilir.</p>
    <nav>
      <a href="/index.html">Ana sayfa</a>
      <a href="/support-v2/login.html">SAP Destek Portalı</a>
    </nav>
  </main>
</body>
</html>
